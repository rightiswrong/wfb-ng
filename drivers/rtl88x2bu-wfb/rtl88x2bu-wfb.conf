# /etc/modprobe.d/rtl88x2bu-wfb.conf
# Driver for wfb-ng on RTL8812BU/RTL8822BU USB cards (module 88x2bu_wfb).

# Keep the in-kernel and the stock out-of-tree drivers off these cards
blacklist rtw88_8822bu
blacklist 88x2bu
blacklist 8812bu

# No power saving, no USB2/USB3 mode switching
options 88x2bu_wfb rtw_power_mgnt=0 rtw_enusbss=0 rtw_switch_usb_mode=0

# TX power index override, 1..63 (0 = driver default). Start low.
# wfb-ng can also set it at runtime: wifi_txpower = -N00 sets index N.
options 88x2bu_wfb rtw_tx_pwr_idx_override=1
